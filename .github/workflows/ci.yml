name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Must match `requires-python` in pyproject.toml.
        python-version: ["3.12", "3.13"]

    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: latest

    - name: Install dependencies
      run: uv sync --group dev --frozen --python "${{ matrix.python-version }}"

    - name: Verify interpreter version
      # uv can provision its own interpreter, so confirm the environment really
      # runs the version named by the matrix entry.
      run: |
        uv run python -V
        uv run python -c "import sys; assert sys.version_info[:2] == tuple(int(p) for p in '${{ matrix.python-version }}'.split('.')), sys.version"

    - name: Run tests
      env:
        ENVIRONMENT: test
        DEBUG: "false"
        DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        JWT_SECRET_KEY: bidar-ci-signing-key-not-for-production
        ALLOWED_HOSTS: "*"
      run: uv run pytest --cov=src --cov-report=xml --cov-report=html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          coverage.xml
          htmlcov/
        retention-days: 30

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: latest

    - name: Install dependencies
      run: uv sync --group dev --frozen --python 3.12

    - name: Check formatting
      run: |
        uv run black --check .
        uv run isort --check-only .

    - name: Lint
      run: uv run flake8 src tests

    - name: Type check
      run: uv run mypy src

  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v5

    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        version: latest

    - name: Install dependencies
      run: uv sync --group dev --frozen --python 3.12

    - name: Run bandit
      # No `|| true`: a new finding fails the job.
      run: uv run bandit -r src -c pyproject.toml

    - name: Audit dependencies
      # Audits the locked environment. --skip-editable only skips the project
      # itself; a known advisory in any dependency fails the job.
      run: uv run pip-audit --skip-editable

    - name: Check that the exported requirements match the lock
      # The Dockerfile installs requirements.txt, so it must not drift from
      # uv.lock.
      run: |
        uv export --no-hashes --no-dev --no-emit-project -o requirements.txt
        git diff --exit-code -- requirements.txt
